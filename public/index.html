<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>Husholdningsverket</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<!-- Hjemskjerm: iPhone bruker apple-touch-icon (ikke SVG), Android bruker manifestet -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Husholdning">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top" id="top" hidden>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M9 17v-3M12 17v-5M15 17v-2"/></svg></div>
    <div class="word">Husholdnings<b>verket</b></div>
  </div>
  <div class="toolbar">
    <span id="hhSlot"></span>
    <div class="month">
      <button class="iconbtn" data-action="prevMonth" aria-label="Forrige måned"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="monthLabel"></span>
      <button class="iconbtn" data-action="nextMonth" aria-label="Neste måned"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <input type="file" id="receiptInput" class="sr" accept="image/*" capture="environment" data-change="receipt">
    <label for="receiptInput" class="btn primary tile" style="cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Kvittering</label>
    <button class="btn mint tile only-mobile" data-action="go" data-view="mat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Mat<span class="tcount" data-count="mat" hidden></span></button>
    <button class="btn mint tile only-mobile" data-action="go" data-view="hjem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>Hus og hjem<span class="tcount" data-count="hjem" hidden></span></button>
    <button class="btn dark imp" data-action="go" data-view="import" aria-label="Importer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl-long">Importer</span></button>
  </div>
</header>

<div class="layout" id="layout" hidden>
  <nav class="side" aria-label="Hovedmeny" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="auth"></div>
<div id="toastHost"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
